name: order-processing

services:
  postgres:
    image: postgres:16.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulisic22}
      POSTGRES_DB: ${POSTGRES_DB:-order_processing}
    command:
      - postgres
      # CDC inactive: logical replication settings retained for reference.
      # - -c
      # - wal_level=logical
      # - -c
      # - max_replication_slots=10
      # - -c
      # - max_wal_senders=10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.0-bookworm
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # kafka:
  #   image: apache/kafka:3.9.1
  #   restart: unless-stopped
  #   environment:
  #     KAFKA_NODE_ID: 1
  #     KAFKA_PROCESS_ROLES: broker,controller
  #     KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #     KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  #     KAFKA_NUM_PARTITIONS: 3
  #     KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
  #     CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
  #   ports:
  #     - '9092:29092'
  #   volumes:
  #     - kafka-data:/tmp/kraft-combined-logs
  #   healthcheck:
  #     test:
  #       [
  #         'CMD-SHELL',
  #         '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
  #       ]
  #     interval: 10s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 20s

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - '9092:9092'
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  migrate:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pulisic22}@postgres:5432/${POSTGRES_DB:-order_processing}
    command: ['yarn', 'db:migrate']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # CDC inactive: Debezium Connect retained for reference.
  # connect:
  #   image: quay.io/debezium/connect:3.0
  #   restart: unless-stopped
  #   environment:
  #     BOOTSTRAP_SERVERS: kafka:9092
  #     GROUP_ID: order-processing-connect
  #     CONFIG_STORAGE_TOPIC: order-processing-connect-configs
  #     OFFSET_STORAGE_TOPIC: order-processing-connect-offsets
  #     STATUS_STORAGE_TOPIC: order-processing-connect-status
  #     CONFIG_STORAGE_REPLICATION_FACTOR: 1
  #     OFFSET_STORAGE_REPLICATION_FACTOR: 1
  #     STATUS_STORAGE_REPLICATION_FACTOR: 1
  #   ports:
  #     - '8083:8083'
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     kafka:
  #       condition: service_healthy
  #   healthcheck:
  #     test:
  #       [
  #         'CMD-SHELL',
  #         'curl -fsS http://localhost:8083/connectors >/dev/null',
  #       ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 30
  #     start_period: 20s

  # connect-init:
  #   build:
  #     context: .
  #     dockerfile: infra/debezium/Dockerfile.init
  #   environment:
  #     CONNECT_URL: http://connect:8083
  #     DEBEZIUM_PG_HOST: postgres
  #     DEBEZIUM_PG_PORT: 5432
  #     DEBEZIUM_PG_USER: ${POSTGRES_USER:-postgres}
  #     DEBEZIUM_PG_PASSWORD: ${POSTGRES_PASSWORD:-pulisic22}
  #     DEBEZIUM_PG_DB: ${POSTGRES_DB:-order_processing}
  #   depends_on:
  #     migrate:
  #       condition: service_completed_successfully
  #     connect:
  #       condition: service_healthy
  #   restart: 'no'

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pulisic22}@postgres:5432/${POSTGRES_DB:-order_processing}
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pulisic22}@postgres:5432/${POSTGRES_DB:-order_processing}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKER: kafka:9092
      RABBITMQ_ENABLED: 'false'
    command: ['yarn', 'start:dev']
    ports:
      - '3200:3200'
    volumes:
      - ./src:/usr/src/app/src
      - ./logs:/usr/src/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # connect-init:
      #   condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3200/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  kafka-data:
